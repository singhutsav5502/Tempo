<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Tempo</title>
  <link rel="stylesheet" href="../theme.css" />
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="root">
    <section id="panel">
      <header class="panel-head">
        <div class="tabs">
          <button class="tab on" data-tab="chat">Chat</button>
          <button class="tab" data-tab="today">Today <span id="today-count"></span></button>
        </div>
        <button class="icon-btn" id="new-chat" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></button>
        <button class="icon-btn" id="collapse" title="Minimize (Esc)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg></button>
      </header>
      <div id="today" hidden></div>
      <div id="banner" hidden></div>
      <div id="msgs"></div>
      <div id="voice-status" hidden></div>
      <form id="composer" autocomplete="off">
        <button class="mic" id="mic" type="button" title="Talk to Tempo"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg></button>
        <textarea id="input" rows="1" placeholder="Schedule, move, or ask about your day…" spellcheck="false"></textarea>
        <button class="send" id="send" type="submit" title="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" /></svg></button>
      </form>
    </section>

    <div id="pill">
      <div class="dot" id="dot"></div>
      <div class="info drag">
        <div class="name" id="name">Free</div>
        <div class="sub" id="sub"></div>
      </div>
      <button class="icon-btn" id="open-main" title="Open calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3" /><path d="M8 3v4M16 3v4M3.5 10h17" /></svg></button>
      <button class="chat-btn" id="chat-btn" title="Ask Tempo"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" /><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z" /></svg></button>
      <div class="progress" id="progress"></div>
    </div>
  </div>
  <script src="voice.js"></script>
  <script src="widget.js"></script>
</body>
</html>
